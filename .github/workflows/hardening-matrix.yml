name: hardening-matrix

# STEP 73 — CI matrix: core / redaction / scope / acceptance slices

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q --tb=line

  scope-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_scope_redteam.py tests/test_secret_leak_audit.py tests/test_budget_enforcement.py tests/test_transport_enforcement.py --tb=line

  corpora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_false_positive_negative_corpus.py tests/test_safe_app_fp_scan.py tests/test_fn_corpus_live.py tests/test_backtesting_lifecycle.py --tb=line

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff (non-blocking until clean)
        run: ruff check magic_security tests --select E,F --ignore E501 || true
