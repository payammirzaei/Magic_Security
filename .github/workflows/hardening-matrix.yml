name: hardening-matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -U pip && pip install -e ".[dev]"
      - run: pytest -q --tb=line

  scope-secrets-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U pip && pip install -e ".[dev]"
      - run: >
          pytest -q
          tests/test_scope_redteam.py
          tests/test_secret_leak_audit.py
          tests/test_budget_enforcement.py
          tests/test_transport_enforcement.py
          tests/test_transport_redirect_stream_dns.py
          --tb=line

  corpora-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U pip && pip install -e ".[dev]"
      - run: >
          pytest -q
          tests/test_false_positive_negative_corpus.py
          tests/test_safe_app_fp_scan.py
          tests/test_fn_corpus_live.py
          tests/test_backtesting_lifecycle.py
          tests/test_workflow_e2e_contracts.py
          tests/test_workflow_cleanup_contract.py
          tests/test_workflow_multi_account_e2e.py
          --tb=line

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U pip && pip install -e ".[dev]"
      - name: Ruff check (blocking)
        run: ruff check magic_security tests --select E,F --ignore E501
