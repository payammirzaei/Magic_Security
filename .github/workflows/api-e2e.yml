name: api-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with api extra
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api]"
      - name: API tests (must not skip)
        run: |
          pytest -q tests/test_dashboard_api.py tests/test_hardening_platform.py --tb=line
          python -c "import fastapi; print('fastapi', fastapi.__version__)"
