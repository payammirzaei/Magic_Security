name: browser-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with browser extra
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,browser]"
          playwright install --with-deps chromium
      - name: Browser unit + vulnerable_app Playwright E2E
        run: |
          pytest -q tests/test_browser.py tests/test_browser_auth.py tests/test_vulnerable_app_browser_e2e.py --tb=line
