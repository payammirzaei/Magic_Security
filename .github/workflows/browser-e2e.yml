name: browser-e2e

# STEP 55 — Browser real E2E (Playwright Chromium)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with browser extra
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,browser]"
          playwright install --with-deps chromium
      - name: Browser-focused tests
        run: |
          pytest -q tests/test_browser.py tests/test_browser_auth.py tests/test_steps_21_30.py -k "browser or xss or websocket or storage" --tb=line
