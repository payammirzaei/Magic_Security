coverage_categories:
  - category: Authentication
    status_family: auth
    check_ids:
      - authentication.sqli.bypass
      - authentication.nosqli.bypass
      - auth.boundary.mapping
      - rate_limit.behavior.observation
    why_partial: "Reset/MFA/session-rotation workflows not configured."

  - category: Authorization / Access Control
    status_family: auth
    check_ids:
      - authorization.bola.read
    why_partial: "Read-only same-role IDOR; state-changing authz needs workflows."

  - category: Session Security
    status_family: auth
    check_ids:
      - session.cookie.missing-attributes
      - cache.authenticated.shared
    why_partial: "No fixation/rotation/logout workflow proofs."

  - category: SQL / Database
    status_family: server
    check_ids:
      - database.error-trigger
      - authentication.sqli.bypass
      - authentication.nosqli.bypass
    why_partial: "Not exhaustive SQLi; error trigger is exposure only."

  - category: Injection
    status_family: external
    check_ids:
      - injection.html.reflected
      - injection.ssti.arithmetic
      - injection.crlf.response-header
    why_partial: "Command/LDAP/etc. not covered; stored injection needs workflows."

  - category: XSS
    status_family: browser
    check_ids:
      - xss.reflected.execution
      - xss.dom.candidate
      - xss.dom.execution
    why_partial: "Stored XSS requires write/read workflow."

  - category: CSRF
    status_family: auth
    check_ids:
      - csrf.posture.candidate
    why_partial: "Posture mapping only; no disposable action proof."

  - category: SSRF
    status_family: server
    check_ids:
      - ssrf.loopback-callback
    why_partial: "Loopback callback only; no metadata/private network."

  - category: File Upload
    status_family: config
    check_ids: []
    why_partial: "Requires disposable upload workflow configuration."

  - category: Path / File Handling
    status_family: server
    check_ids:
      - path.traversal.local-file-read
      - exposure.deployment-artifact.public
    why_partial: "Marker-based traversal; not arbitrary file read."

  - category: API Security
    status_family: external
    check_ids:
      - authorization.bola.read
      - classifier.sensitive_json
      - cors.arbitrary-origin
    why_partial: "No mass-assignment or BFLA pack yet."

  - category: REST / HTTP
    status_family: external
    check_ids:
      - http.trace.reflection
      - http.methods.dangerous-advertised
      - http.host-header.influence
    why_partial: "Protocol subset only."

  - category: GraphQL
    status_family: external
    check_ids:
      - graphql.introspection.anonymous
      - graphql.errors.debug
    why_partial: "No field-level auth or complexity abuse."

  - category: WebSockets
    status_family: browser
    check_ids:
      - websocket.plaintext-transport
    why_partial: "Discovery/transport only; no auth/origin handshake pack."

  - category: Business Logic
    status_family: config
    check_ids: []
    why_partial: "Requires explicit invariants and disposable journeys."

  - category: Race Conditions
    status_family: config
    check_ids: []
    why_partial: "Requires concurrent disposable workflows."

  - category: Payments
    status_family: config
    check_ids: []
    why_partial: "Requires sandbox payment flows."

  - category: Cryptography
    status_family: partial
    check_ids: []
    why_partial: "No dedicated crypto/TLS deep analysis pack."

  - category: Secrets
    status_family: external
    check_ids:
      - exposure.env.public
      - exposure.config.secret-keys
      - client.secret-like-material
      - privacy.url.secret
    why_partial: "Client/public artifacts only; repo secret scanning planned."

  - category: Security Headers
    status_family: passive
    check_ids:
      - hardening.header.missing
      - browser.csp.risky-script-mode
    why_partial: "Passive header inspection only."

  - category: CORS
    status_family: external
    check_ids:
      - cors.arbitrary-origin
      - cors.null-origin
      - cors.protected.credentialed
    why_partial: "Common reflection/credentialed cases; not every CORS edge case."

  - category: Clickjacking
    status_family: passive
    check_ids:
      - browser.clickjacking.missing-protection
    why_partial: "Header posture only; no framed click proof."

  - category: Redirects / URLs
    status_family: external
    check_ids:
      - redirect.open
      - redirect.client.candidate
    why_partial: "Client redirects remain candidates until runtime proof."

  - category: Information Disclosure
    status_family: external
    check_ids:
      - exposure.directory-listing
      - exposure.debug-output
      - exposure.git.public
      - exposure.sourcemap.public
      - client.internal-topology
      - exposure.debug-status.public
      - exposure.heapdump.public
    why_partial: "Observable public surfaces only."

  - category: Error Handling
    status_family: external
    check_ids:
      - exposure.debug-output
      - database.error-trigger
      - graphql.errors.debug
    why_partial: "Signature-based error disclosure only."

  - category: DoS / Resource Exhaustion
    status_family: config
    check_ids: []
    why_partial: "Intentionally unsupported without explicit config."

  - category: Rate Limiting
    status_family: external
    check_ids:
      - rate_limit.behavior.observation
    why_partial: "Bounded classification; not enforcement testing."

  - category: Cloud / Infrastructure
    status_family: partial
    check_ids: []
    why_partial: "Requires infrastructure adapters (planned)."

  - category: Docker / Container
    status_family: repo
    check_ids: []
    why_partial: "Requires repo access."

  - category: CI/CD
    status_family: repo
    check_ids: []
    why_partial: "Requires repo access."

  - category: Supply Chain
    status_family: repo
    check_ids: []
    why_partial: "Requires repo/dependency manifests analysis."

  - category: Frontend
    status_family: browser
    check_ids:
      - xss.dom.candidate
      - xss.dom.execution
