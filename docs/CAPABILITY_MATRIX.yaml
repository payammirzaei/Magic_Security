# Magic_Security Capability Matrix
# Frozen inventory for STEP 2 of CURSOR_50_STEP_BUILD_PLAN.md
# Separates concrete checks from the 42-category coverage registry.
# Maturity: verified | partial | passive | planned
# Modes: http | browser | active | auth

